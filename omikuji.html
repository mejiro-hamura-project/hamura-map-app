<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ</title>
<style>
  :root {
    --bg: #7a0f16;
    --bg-dark: #4d090e;
    --gold: #d4af37;
    --gold-light: #f3d98b;
    --paper: #fdf6e3;
    --paper-shadow: #e8dcb8;
    --text: #3a2410;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, var(--bg) 0%, var(--bg-dark) 100%);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Segoe UI", serif;
    padding: 24px;
  }

  .app {
    width: 360px;
    max-width: 100%;
    text-align: center;
  }

  h1 {
    color: var(--gold-light);
    letter-spacing: 0.3em;
    font-size: 28px;
    margin: 0 0 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  .subtitle {
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    margin-bottom: 32px;
    letter-spacing: 0.15em;
  }

  .box-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 32px;
    cursor: pointer;
    user-select: none;
  }

  .box {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #b23b2e 0%, #8a2418 100%);
    border: 6px solid var(--gold);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--gold-light);
    letter-spacing: 0.2em;
    transition: transform 0.15s ease;
  }

  .box-wrap:active .box {
    transform: scale(0.97);
  }

  .box.shaking {
    animation: shake 0.5s ease-in-out infinite;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-6deg) translateX(-4px); }
    40% { transform: rotate(5deg) translateX(4px); }
    60% { transform: rotate(-4deg) translateX(-3px); }
    80% { transform: rotate(3deg) translateX(3px); }
  }

  .hint {
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    margin-bottom: 8px;
    min-height: 16px;
  }

  .result-card {
    background: var(--paper);
    border-radius: 8px;
    padding: 32px 20px 28px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45), inset 0 0 0 1px var(--paper-shadow);
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transition: opacity 0.4s ease, transform 0.4s ease;
    position: relative;
  }

  .result-card::before,
  .result-card::after {
    content: "";
    position: absolute;
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: var(--paper-shadow);
  }
  .result-card::before { left: 14px; }
  .result-card::after { right: 14px; }

  .result-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .rank {
    font-size: 44px;
    font-weight: bold;
    color: var(--bg);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.08);
  }

  .message {
    color: var(--text);
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 0.05em;
  }

  .redraw {
    margin-top: 24px;
    display: none;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .redraw:hover {
    background: var(--gold);
    color: var(--bg-dark);
  }

  .redraw.show {
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>おみくじ</h1>
    <div class="subtitle">今日の運勢を占いましょう</div>

    <div class="box-wrap" id="boxWrap">
      <div class="box" id="box">おみくじを引く</div>
    </div>
    <div class="hint" id="hint">箱をタップして運勢を確かめよう</div>

    <div class="result-card" id="resultCard">
      <div class="rank" id="rank"></div>
      <div class="message" id="message"></div>
    </div>

    <button class="redraw" id="redraw">もう一度引く</button>
  </div>

<script>
  const fortunes = [
    { rank: "大吉", weight: 8,  message: "最高の運勢。何事も思い切って挑戦すると良い結果が舞い込みます。" },
    { rank: "中吉", weight: 15, message: "運気は上向き。焦らず着実に進めば願いが叶うでしょう。" },
    { rank: "小吉", weight: 20, message: "小さな幸運が続きます。身近な人への感謝を忘れずに。" },
    { rank: "吉",   weight: 25, message: "穏やかで安定した運勢。今のペースを大切に。" },
    { rank: "末吉", weight: 15, message: "これから運が上がっていく兆し。焦らず準備を。" },
    { rank: "凶",   weight: 12, message: "少し慎重に。無理をせず、周りの助言に耳を傾けて。" },
    { rank: "大凶", weight: 5,  message: "今日は控えめに過ごすのが吉。明日はきっと良くなります。" },
  ];

  function drawFortune() {
    const total = fortunes.reduce((sum, f) => sum + f.weight, 0);
    let r = Math.random() * total;
    for (const f of fortunes) {
      if (r < f.weight) return f;
      r -= f.weight;
    }
    return fortunes[fortunes.length - 1];
  }

  const boxWrap = document.getElementById("boxWrap");
  const box = document.getElementById("box");
  const hint = document.getElementById("hint");
  const resultCard = document.getElementById("resultCard");
  const rankEl = document.getElementById("rank");
  const messageEl = document.getElementById("message");
  const redrawBtn = document.getElementById("redraw");

  let drawing = false;

  function reveal(fortune) {
    rankEl.textContent = fortune.rank;
    messageEl.textContent = fortune.message;
    resultCard.classList.add("show");
    redrawBtn.classList.add("show");
    box.classList.remove("shaking");
    box.textContent = "おみくじを引く";
    hint.textContent = "";
    drawing = false;
  }

  function startDraw() {
    if (drawing) return;
    drawing = true;
    resultCard.classList.remove("show");
    redrawBtn.classList.remove("show");
    box.classList.add("shaking");
    box.textContent = "…";
    hint.textContent = "運勢を占っています…";

    const fortune = drawFortune();
    setTimeout(() => reveal(fortune), 900);
  }

  boxWrap.addEventListener("click", startDraw);
  redrawBtn.addEventListener("click", startDraw);
</script>
</body>
</html>
